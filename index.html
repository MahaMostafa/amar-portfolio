<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amar · The Issue</title>
<meta name="description" content="Amar Suleiman, Marketing & Brand Strategist. A portfolio you read like a printed magazine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Jost:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/page-motion.css">
<link rel="stylesheet" href="shared/reader.css">
<style>
  :root { --desk: #1A1412; }
  html { background: var(--desk); }
  body { background: var(--desk); color: var(--cream); font-family: var(--sans); }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .light {
    position: absolute; inset: -10%;
    background:
      radial-gradient(60% 55% at 50% 42%, rgba(255, 226, 196, .16), rgba(255, 226, 196, 0) 70%),
      radial-gradient(120% 90% at 50% 120%, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 60%),
      var(--desk);
  }
  .light::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .5; mix-blend-mode: soft-light; }

  .wrap { position: absolute; left: 50%; top: 50%; width: 1080px; height: 720px; }
  .rise { position: absolute; inset: 0; transition: transform .9s var(--ease-out), opacity .9s var(--ease-out); }
  .loading .rise { transform: translateY(28px); opacity: 0; }
  .book { position: absolute; inset: 0; will-change: transform; }
  .ground {
    position: absolute; left: 0; top: 40px; width: 1080px; height: 720px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 70%);
    filter: blur(18px);
  }

  .leaf {
    position: absolute; left: 540px; top: 0; width: 540px; height: 720px;
    transform-origin: 0 50%; transform-style: preserve-3d; will-change: transform;
  }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .face.front::before { background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,.07) 5%, rgba(255,255,255,.05) 9%, rgba(0,0,0,0) 16%); }
  .face.back::before  { background: linear-gradient(270deg, rgba(0,0,0,.22), rgba(0,0,0,.07) 5%, rgba(255,255,255,.05) 9%, rgba(0,0,0,0) 16%); }
  .leaf.first .face.front::before { background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.08) 1.6%, rgba(0,0,0,0) 4%); }
  .shade { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; }
  .front .shade { background: linear-gradient(90deg, rgba(20,10,8,.05), rgba(20,10,8,.5)); }
  .back .shade  { background: linear-gradient(270deg, rgba(255,250,240,0), rgba(255,250,240,.25) 40%, rgba(20,10,8,.35)); }

  .cast { position: absolute; top: 0; width: 540px; height: 720px; pointer-events: none; opacity: 0; z-index: 99; will-change: transform, opacity; }
  .cast.r { left: 540px; transform-origin: 0 50%; background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.12) 70%, rgba(0,0,0,0)); }
  .cast.l { left: 0; transform-origin: 100% 50%; background: linear-gradient(270deg, rgba(0,0,0,.55), rgba(0,0,0,.12) 70%, rgba(0,0,0,0)); }

  .edge { position: absolute; top: 3px; height: 714px; pointer-events: none; background: repeating-linear-gradient(90deg, #EFE9E1 0 1px, #CFC6BA 1px 2px); }
  .edge.r { left: 1080px; border-radius: 0 2px 2px 0; }
  .edge.l { right: 1080px; border-radius: 2px 0 0 2px; }

  /* chrome */
  .top, .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; z-index: 10; pointer-events: none; transition: opacity .6s ease; }
  .loading .top, .loading .bar, .loading .hint { opacity: 0; }
  .top { top: 0; font: 500 10px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: rgba(246,241,234,.72); }
  .top b { font: 400 22px/1 var(--serif); letter-spacing: .06em; text-transform: uppercase; color: var(--cream); }
  .bar { bottom: 0; }
  .bar > * { pointer-events: auto; }
  .count { font: 500 9.5px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: rgba(246,241,234,.72); min-width: 160px; }
  .count b { font: 400 15px/1 var(--serif); letter-spacing: 0; color: var(--cream); margin-inline-end: 8px; }
  .track { position: absolute; left: 50%; transform: translateX(-50%); bottom: 32px; width: min(360px, 40vw); height: 1px; background: rgba(246,241,234,.18); }
  .track i { position: absolute; left: 0; top: -1px; height: 3px; width: 100%; background: var(--blush); transform-origin: 0 50%; transform: scaleX(0); }
  .snd { color: var(--cream); border-color: rgba(246,241,234,.35); }
  @media (hover: hover) and (pointer: fine) { .snd:hover { background: rgba(246,241,234,.1); } }

  .hint { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font: 500 9px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: rgba(246,241,234,.65); z-index: 10; white-space: nowrap; transition: opacity .5s ease; pointer-events: none; }
  .hint .lot { width: 34px; height: 34px; }
  .hint.gone { opacity: 0; }

  /* loader: the Lottie book turning its pages while the issue loads */
  .loader { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--desk); transition: opacity .6s var(--ease-out), visibility 0s linear .6s; }
  .loader.gone { opacity: 0; visibility: hidden; }
  .loader .in { text-align: center; }
  .loader .lot { width: 190px; height: 190px; margin: 0 auto -18px; }
  .loader .mast { font: 400 34px/1 var(--serif); letter-spacing: .14em; color: var(--cream); }
  .loader .sub { margin-top: 12px; font: 500 10px/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: rgba(246,241,234,.68); }

  /* intro */
  .intro { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center start; padding-inline-start: 6vw; pointer-events: none;
    background: linear-gradient(90deg, rgba(26,20,18,.9) 0%, rgba(26,20,18,.55) 22%, rgba(26,20,18,0) 34%); transition: opacity .5s var(--ease-out), visibility 0s linear .5s; }
  .intro.gone, .loading .intro { opacity: 0; visibility: hidden; }
  .intro .card { max-width: 24vw; pointer-events: auto; }
  .intro .kick { color: var(--blush); }
  .intro h1 { font: 400 clamp(30px, 3.4vw, 46px)/1.02 var(--serif); margin: 14px 0 12px; }
  .intro h1 i { font-style: italic; }
  .intro p { margin: 0 0 24px; color: rgba(246,241,234,.72); font: 400 15px/1.5 var(--text); }
  .btns { display: flex; gap: 10px; flex-direction: column; align-items: flex-start; }
  .btn { cursor: pointer; border-radius: 999px; padding: 13px 22px; font: 500 10px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; border: 1px solid rgba(246,241,234,.35); background: transparent; color: var(--cream); transition: transform .16s var(--ease-out), background-color .2s ease; }
  .btn.primary { background: var(--cream); color: var(--burgundy-2); border-color: var(--cream); }
  .btn:active { transform: scale(.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: rgba(246,241,234,.1); } .btn.primary:hover { background: #fff; } }
  .btn:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }

  @media (max-width: 1100px) {
    .intro { place-items: end center; padding: 0 16px 9vh; background: linear-gradient(180deg, rgba(26,20,18,0) 45%, rgba(26,20,18,.94) 80%); }
    .intro .card { text-align: center; max-width: none; }
    .btns { flex-direction: row; justify-content: center; flex-wrap: wrap; }
  }
  @media (max-width: 760px) {
    .top, .bar { padding: 14px 16px; } .track { display: none; } .count { min-width: 0; }
    .top span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .rise { transition: opacity .3s ease; } .loading .rise { transform: none; } }
</style>
</head>
<body class="loading">
  <div id="spacer"></div>
  <main class="stage" aria-label="Amar Suleiman portfolio, presented as a magazine">
    <div class="light"></div>
    <div class="wrap" id="wrap">
      <div class="rise">
        <div class="ground" id="ground"></div>
        <div class="book" id="book">
          <div class="edge l" id="edgeL"></div>
          <div class="edge r" id="edgeR"></div>
          <div class="cast l" id="castL"></div>
          <div class="cast r" id="castR"></div>
        </div>
      </div>
    </div>
  </main>

  <header class="top"><b>Amar</b><span>Portfolio · 2024/26</span></header>
  <footer class="bar">
    <span class="count" id="count" aria-live="polite">Cover</span>
    <span class="track"><i id="prog"></i></span>
    <span id="sndSlot"></span>
  </footer>
  <div class="hint" id="hint"><span class="lot" id="hintLot" aria-hidden="true"></span><span>Scroll to turn the page</span></div>

  <div class="intro" id="intro">
    <div class="card">
      <div class="kick">Portfolio · 2024/26</div>
      <h1>The <i>Amar</i> Issue</h1>
      <p>Strategy, storytelling, and creative direction in 26 pages.</p>
      <div class="btns">
        <button class="btn primary" id="openSound">Open with sound</button>
        <button class="btn" id="openQuiet">Read quietly</button>
      </div>
    </div>
  </div>

  <div class="loader" id="loader" role="status" aria-label="Loading the portfolio">
    <div class="in">
      <div class="lot" id="loaderLot" aria-hidden="true"></div>
      <div class="mast">AMAR</div>
      <div class="sub">Preparing the portfolio</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
<script src="assets/lottie/turn-page.js"></script>
<script src="shared/paper-sound.js"></script>
<script src="shared/pages.js"></script>
<script>
(() => {
  const pages = window.MAG_PAGES;
  const N = pages.length / 2;                 // leaves
  const W = 540;
  const book = document.getElementById("book"), wrap = document.getElementById("wrap"), ground = document.getElementById("ground");
  const castL = document.getElementById("castL"), castR = document.getElementById("castR");
  const edgeL = document.getElementById("edgeL"), edgeR = document.getElementById("edgeR");
  const hint = document.getElementById("hint"), intro = document.getElementById("intro");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- Lottie: recolour the line-art book to the issue's palette ---- */
  const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).concat(1);
  function recolor(data, stroke, fill, width) {
    const d = JSON.parse(JSON.stringify(data));
    (function walk(o) {
      if (Array.isArray(o)) return o.forEach(walk);
      if (o && typeof o === "object") {
        if (o.ty === "st") { o.c.k = stroke; if (width) o.w.k = width; }
        if (o.ty === "fl") o.c.k = fill;
        Object.values(o).forEach(walk);
      }
    })(d);
    return d;
  }
  function lottieInto(el, width) {
    if (!window.lottie || !window.TURN_PAGE_LOTTIE) return null;
    return lottie.loadAnimation({
      container: el, renderer: "svg", loop: true, autoplay: !reduce,
      animationData: recolor(TURN_PAGE_LOTTIE, rgb("#F6F1EA"), rgb("#1A1412"), width),
    });
  }
  const loaderAnim = lottieInto(document.getElementById("loaderLot"), 16);
  lottieInto(document.getElementById("hintLot"), 60);

  /* ---- build leaves: leaf i → front = page 2i, back = page 2i+1 ---- */
  const leaves = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement("div");
    el.className = i === 0 ? "leaf first" : "leaf";
    el.innerHTML = `<div class="face front">${renderPage(pages[2 * i])}<div class="shade"></div></div>
                    <div class="face back">${renderPage(pages[2 * i + 1])}<div class="shade"></div></div>`;
    book.appendChild(el);
    leaves.push({ el, front: el.querySelector(".front .shade"), back: el.querySelector(".back .shade"), prev: 0 });
  }
  document.getElementById("sndSlot").appendChild(PaperSound.button());

  /* ---- geometry: desktop turns a leaf per step; phones show one page per step ---- */
  const lenis = (!reduce && window.Lenis) ? new Lenis({ lerp: .08, wheelMultiplier: .75, touchMultiplier: 1.4 }) : null;
  const jump = y => lenis ? lenis.scrollTo(y, { immediate: true, force: true }) : scrollTo(0, y);
  let vh = innerHeight, step = 1, mobile = false, maxQ = N, lastQ = -1;
  function layout() {
    const keep = scrollY / (maxQ * step);                     // stay at the same point in the issue
    vh = innerHeight;
    mobile = innerWidth < 760;
    maxQ = mobile ? 2 * N - 1 : N;
    step = vh * (mobile ? .8 : .9);
    document.getElementById("spacer").style.height = (maxQ * step + vh) + "px";
    const scale = mobile ? Math.min(innerWidth * .9 / W, vh * .74 / 720) : Math.min(innerWidth * .9 / 1080, vh * .8 / 720);
    wrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
    if (keep > 0) jump(keep * maxQ * step);
    lastQ = -1;
  }
  layout(); addEventListener("resize", layout);

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = t => t * t * (3 - 2 * t);
  let velocity = 0, prevY = scrollY;

  function render() {
    const y = scrollY;
    velocity = velocity * .8 + (y - prevY) * .2; prevY = y;
    const q = clamp(y / step, 0, maxQ);
    if (Math.abs(q - lastQ) < 1e-4) return;
    lastQ = q;
    const leafT = i => clamp(mobile ? q - 2 * i : q - i, 0, 1);

    let active = -1, flipped = 0;
    for (let i = 0; i < N; i++) {
      const L = leaves[i];
      let t = leafT(i);
      if (reduce) t = t < .5 ? 0 : 1;
      const e = smooth(t), lift = Math.sin(Math.PI * e);
      flipped += e;
      L.el.style.transform = `perspective(2600px) rotateY(${-180 * e}deg) translateZ(${lift * 18}px) skewY(${lift * -1.2}deg)`;
      L.el.style.zIndex = (t > 0 && t < 1) ? 100 : (t >= 1 ? i + 1 : N - i + 1);
      L.front.style.opacity = e < .5 ? (lift * .9).toFixed(3) : 0;
      L.back.style.opacity = e >= .5 ? (lift * .9).toFixed(3) : 0;
      if (t > 0 && t < 1) active = i;

      const I = clamp(.35 + Math.abs(velocity) / 50, .35, 1);
      if (L.prev < .05 && t >= .05) PaperSound.flip({ intensity: I, dir: 1 });
      if (L.prev > .95 && t <= .95) PaperSound.flip({ intensity: I, dir: -1 });
      if (L.prev < .985 && t >= .985) PaperSound.land({ intensity: I * .8, pan: -.3 });
      if (L.prev > .015 && t <= .015) PaperSound.land({ intensity: I * .8, pan: .3 });
      L.prev = t;
    }

    // cast shadow from the turning leaf onto the page beneath
    if (active >= 0 && !reduce) {
      const e = smooth(leafT(active)), a = Math.PI * e, onRight = e < .5;
      const c = onRight ? castR : castL, o = onRight ? castL : castR;
      c.style.opacity = (Math.sin(a) * .8).toFixed(3);
      c.style.transform = `scaleX(${Math.abs(Math.cos(a)) * .9 + .05})`;
      o.style.opacity = 0;
      if ((active === 0 && !onRight) || (active === N - 1 && onRight)) c.style.opacity = 0;
    } else { castL.style.opacity = 0; castR.style.opacity = 0; }

    // where the book sits
    let x;
    if (mobile) {
      // the camera follows the page: turning carries you to the left page, then it slides on to the next right page
      const k = Math.floor(Math.min(q, maxQ - 1e-6)), f = smooth(q - k);
      x = k % 2 === 0 ? -W / 2 + W * f : W / 2 - W * f;
    } else {
      const t0 = smooth(leafT(0)), tN = smooth(leafT(N - 1));
      x = (-W / 2) * (1 - t0) + (W / 2) * tN;
      ground.style.transform = `scaleX(${.5 + .5 * (t0 - tN)})`;
    }
    book.style.transform = `translateX(${x}px)`;

    // page-block thickness
    edgeR.style.width = (Math.max(0, N - flipped) * 1.1) + "px";
    edgeR.style.opacity = flipped >= N - .02 ? 0 : 1;
    edgeL.style.width = (flipped * 1.1) + "px";
    edgeL.style.opacity = flipped <= .02 ? 0 : 1;

    // chrome
    const s = Math.round(q);
    const count = document.getElementById("count");
    if (mobile) count.innerHTML = s === 0 ? "Cover" : s === maxQ ? "Back cover" : `<b>${s}</b>of ${maxQ - 1}`;
    else count.innerHTML = s === 0 ? "Cover" : s === N ? "Back cover" : `<b>${2 * s - 1} · ${2 * s}</b>Spread ${s} of ${N - 1}`;
    document.getElementById("prog").style.transform = `scaleX(${q / maxQ})`;
    if (q > .6) hint.classList.add("gone");

    // once the paper settles, mark the pages lying open so they can animate their own content in
    if (Math.abs(q - s) < .02 && s !== openAt) { openAt = s; markOpen(s); }
  }

  /* ---- open pages: .pg.is-open + a "mag:open" event (used by page animations and the phone reader) ---- */
  let openAt = -1, openIdx = [];
  function visibleIndices(s) {
    if (mobile) return [s];                                   // phones: one page per step, page index = step
    return s === 0 ? [0] : s === N ? [2 * N - 1] : [2 * s - 1, 2 * s];
  }
  function markOpen(s) {
    openIdx = visibleIndices(s);
    book.querySelectorAll(".pg.is-open").forEach(p => p.classList.remove("is-open"));
    openIdx.forEach(i => { const el = book.querySelector(`.pg[data-page="${pages[i].id}"]`); if (el) el.classList.add("is-open"); });
    document.dispatchEvent(new CustomEvent("mag:open", { detail: { indices: openIdx, ids: openIdx.map(i => pages[i].id) } }));
  }
  function loop(t) { if (lenis) lenis.raf(t); render(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  /* ---- settle on the nearest page, like paper falling flat ---- */
  let dir = 1, snapTimer = 0, lastY = scrollY, busy = false;
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function go(target, duration = 1.05) {
    target = clamp(target, 0, maxQ); busy = true;
    const done = () => { busy = false; };
    if (lenis) lenis.scrollTo(target * step, { duration, easing: easeInOut, onComplete: done });
    else { scrollTo({ top: target * step, behavior: reduce ? "auto" : "smooth" }); setTimeout(done, 700); }
  }
  addEventListener("scroll", () => {
    if (scrollY !== lastY) dir = scrollY > lastY ? 1 : -1;
    lastY = scrollY;
    if (scrollY > 4) intro.classList.add("gone");
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      if (busy) return;
      const q = scrollY / step, f = q - Math.floor(q);
      if (f < .003 || f > .997) return;
      go(dir > 0 ? (f > .22 ? Math.ceil(q) : Math.floor(q)) : (f < .78 ? Math.floor(q) : Math.ceil(q)), .75);
    }, 140);
  }, { passive: true });

  const cur = () => Math.round(scrollY / step);
  addEventListener("keydown", e => {
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur() + 1); }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur() - 1); }
    if (e.key === "Home") { e.preventDefault(); go(0, 1.6); }
  });
  // desktop: click the right side to turn forward, the left side to turn back (links keep working)
  // phones: a tap is announced as "mag:tap" (the reading mode opens on it); swipes still turn pages
  book.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    if (mobile) {
      const pg = e.target.closest(".pg");
      const index = pg ? pages.findIndex(p => p.id === pg.dataset.page) : openIdx[0];
      document.dispatchEvent(new CustomEvent("mag:tap", { detail: { index, id: pages[index] && pages[index].id } }));
      return;
    }
    go(e.clientX > innerWidth / 2 ? cur() + 1 : cur() - 1);
  });
  book.style.cursor = "pointer";

  // a small public handle for add-ons (reader mode, page animations)
  window.MAG = {
    pages, N, go, renderPage: window.renderPage,
    get mobile() { return mobile; },
    get q() { return lastQ; },
    get open() { return openIdx.slice(); },
    lock(on) { if (lenis) on ? lenis.stop() : lenis.start(); document.documentElement.style.overflow = on ? "hidden" : ""; },
  };

  /* ---- open: wait for type and the first pages, then lift the loader ---- */
  const hp = /p=([\d.]+)/.exec(location.hash);              // #p=3 opens at a given spread
  const firstImgs = [...leaves[0].el.querySelectorAll("img"), ...leaves[1].el.querySelectorAll("img")];
  const ready = Promise.all([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    ...firstImgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()),
    new Promise(r => setTimeout(r, reduce ? 300 : 1800)),     // let the book turn at least once
  ]);
  Promise.race([ready, new Promise(r => setTimeout(r, 6000))]).then(() => {
    document.getElementById("loader").classList.add("gone");
    document.body.classList.remove("loading");
    setTimeout(() => { if (loaderAnim) loaderAnim.destroy(); }, 800);
    if (hp) { jump(parseFloat(hp[1]) * step); intro.classList.add("gone"); }
  });

  const start = (sound) => { if (sound) PaperSound.setOn(true); intro.classList.add("gone"); setTimeout(() => go(1, 1.3), 180); };
  document.getElementById("openSound").addEventListener("click", () => start(true));
  document.getElementById("openQuiet").addEventListener("click", () => start(false));
})();
</script>
<script src="shared/reader.js"></script>
</body>
</html>
